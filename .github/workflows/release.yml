name: Release Build
on:
  push:
    tags:
      - 'v*' # Se activa al crear una etiqueta de versión como v1.0.0

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: 'macos-latest'
            args: ''
            mobile: false
          - platform: 'windows-latest'
            args: ''
            mobile: false
          - platform: 'ubuntu-latest' # Para Android usamos Ubuntu
            args: ''
            mobile: true
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.platform == 'ubuntu-latest' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || '' }}

      - name: Setup Android SDK (Ubuntu only)
        if: matrix.settings.platform == 'ubuntu-latest'
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK (Ubuntu only)
        if: matrix.settings.platform == 'ubuntu-latest'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Set NDK Environment Variables (Ubuntu only)
        if: matrix.settings.platform == 'ubuntu-latest'
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Setup Java (Ubuntu only)
        if: matrix.settings.platform == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Build Tauri Desktop/Mobile App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App-kalendars ${{ github.ref_name }}'
          releaseBody: 'Versión compilada multiplataforma para macOS, Windows y Android.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.settings.args }}
          mobile: ${{ matrix.settings.mobile }}
