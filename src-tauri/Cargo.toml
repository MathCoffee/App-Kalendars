[package]
name = "app-kalendars"
version = "1.0.0"
description = "Calendarios Autónomos Prehispánicos Multiplataforma"
authors = ["Ramiro"]
edition = "2021"

[lib]
name = "app_kalendars"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
